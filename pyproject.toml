[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-quality"
version = "0.1.0"
description = "Automated LaTeX academic report quality improvement system for PFE reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Report Quality System"}
]
keywords = ["latex", "academic-writing", "quality-analysis", "pfe", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LaTeX parsing
    "pylatexenc>=2.10",
    "plasTeX>=3.0",
    
    # Bibliography management
    "pybtex>=0.24.0",
    
    # NLP and text processing
    "spacy>=3.7.0",
    "language-tool-python>=2.7.1",
    
    # Scientific computing and ML
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    
    # Image processing
    "Pillow>=10.0.0",
    
    # Configuration and data handling
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    
    # CLI interface
    "click>=8.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    
    # Utilities
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
report-quality = "report_quality.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["report_quality*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=report_quality --cov-report=term-missing"
